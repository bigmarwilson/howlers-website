<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Member Dashboard | Howlers Dog Park</title>
<style>
/* ---------- GLOBAL STYLES ---------- */
body {
  margin: 0;
  font-family: 'Segoe UI', sans-serif;
  background: radial-gradient(circle at top left, #14171d 0%, #0b0d10 55%, #050608 100%);
  color: #fff;
  overflow-x: hidden;
}

/* Ambient shimmer behind everything */
.ambient-shimmer {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: radial-gradient(circle at 20% 40%, rgba(53,229,255,0.15), transparent 70%),
              radial-gradient(circle at 80% 60%, rgba(255,95,209,0.15), transparent 70%);
  background-size: 200% 200%;
  animation: shimmerFlow 12s ease-in-out infinite;
  z-index: -2;
}
@keyframes shimmerFlow {
  0% { background-position: 0% 50%; opacity: 0.4; }
  50% { background-position: 100% 50%; opacity: 0.6; }
  100% { background-position: 0% 50%; opacity: 0.4; }
}

/* Rottweiler silhouette watermark */
.watermark {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: url('rottweiler-silhouette.png') center/contain no-repeat;
  opacity: 0.05;
  z-index: -1;
}

/* ---------- HEADER ---------- */
header {
  background: rgba(0,0,0,0.6);
  border-bottom: 1px solid rgba(53,229,255,0.4);
  box-shadow: 0 0 15px rgba(53,229,255,0.3);
  backdrop-filter: blur(6px);
  text-align: center;
  padding: 10px 0;
}
header h2 {
  font-size: 1.8em;
  letter-spacing: 2px;
  color: #5bff7a;
  text-shadow: 0 0 10px rgba(91,255,122,0.6);
}
header nav a {
  color: #35e5ff;
  text-decoration: none;
  margin: 0 10px;
  transition: color 0.3s ease;
}
header nav a:hover {
  color: #ff5fd1;
}

/* ---------- MAIN CONTAINER ---------- */
.main {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 40px 20px;
}

/* ---------- WELCOME HEADER ---------- */
.welcome {
  text-align: center;
  margin-bottom: 30px;
}
.welcome h1 {
  color: #35e5ff;
  text-shadow: 0 0 12px rgba(53,229,255,0.6);
}
.welcome p {
  color: #5bff7a;
}

/* ---------- CALENDAR ---------- */
.calendar-container {
  text-align: center;
  margin: 40px auto;
  width: 80%;
  max-width: 900px;
  border: 1px solid rgba(53,229,255,0.3);
  border-radius: 12px;
  box-shadow: 0 0 25px rgba(53,229,255,0.25);
  padding: 20px;
  background: rgba(0,0,0,0.4);
  backdrop-filter: blur(6px);
}
.calendar-title {
  color: #5bff7a;
  text-shadow: 0 0 10px rgba(91,255,122,0.6);
  margin-bottom: 20px;
}
.calendar-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 10px;
}
.calendar-day {
  background: #0b0d10;
  border-radius: 8px;
  padding: 15px 0;
  cursor: pointer;
  position: relative;
  transition: all 0.3s ease;
  box-shadow: 0 0 10px rgba(53,229,255,0.2);
}
.calendar-day:hover {
  transform: scale(1.05);
  box-shadow: 0 0 20px rgba(255,95,209,0.6);
}
.calendar-dot {
  position: absolute;
  bottom: 6px;
  right: 6px;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  box-shadow: 0 0 6px currentColor;
  animation: dotPulse 3s ease-in-out infinite;
}
.calendar-dot.low { color: #5bff7a; }
.calendar-dot.medium { color: #ffb347; }
.calendar-dot.high { color: #ff5fd1; }
.calendar-dot.booked { color: #35e5ff; }
@keyframes dotPulse {
  0%,100% { opacity: 0.6; transform: scale(1); }
  50% { opacity: 1; transform: scale(1.3); }
}

/* ---------- POP-UP CARD ---------- */
.popup-overlay {
  display: none;
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: radial-gradient(circle at center, rgba(0,0,0,0.5) 0%, rgba(0,0,0,0.9) 100%);
  justify-content: center;
  align-items: center;
  z-index: 10;
  animation: overlayPulse 8s ease-in-out infinite;
}
@keyframes overlayPulse {
  0%,100% { background: radial-gradient(circle at center, rgba(0,0,0,0.5) 0%, rgba(0,0,0,0.9) 100%); }
  50% { background: radial-gradient(circle at center, rgba(0,0,0,0.7) 0%, rgba(0,0,0,1) 100%); }
}
.popup-card {
  position: relative;
  background: rgba(11,13,16,0.6);
  border: 2px solid rgba(53,229,255,0.4);
  border-radius: 12px;
  box-shadow: 0 0 25px rgba(91,255,122,0.5), inset 0 0 20px rgba(53,229,255,0.2);
  backdrop-filter: blur(12px);
  padding: 30px;
  width: 340px;
  text-align: center;
  animation: fadeIn 0.6s ease-in;
  transition: all 0.4s ease;
}
.popup-card:hover {
  box-shadow: 0 0 35px rgba(255,95,209,0.6), inset 0 0 25px rgba(53,229,255,0.3);
  transform: scale(1.03);
}
.popup-card::before {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: 12px;
  padding: 2px;
  background: linear-gradient(120deg, #35e5ff, #5bff7a, #ff5fd1, #ffb347, #35e5ff);
  background-size: 300% 300%;
  animation: borderFlow 6s linear infinite;
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite: xor;
  mask-composite: exclude;
}
@keyframes borderFlow {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}
.popup-card::after {
  content: "";
  position: absolute;
  top: 0;
  left: -50%;
  width: 50%;
  height: 100%;

  transform: skewX(-25deg);
  animation: reflectionSweep 6s linear infinite;
  pointer-events: none;
}
