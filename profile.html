<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>User Profile | Howlers Backyard</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <header class="profile-header">
    <h1>Dog Profile</h1>
    <a href="dashboard.html" class="back-link">← Back to Dashboard</a>
  </header>

  <main class="profile-main">
    <section class="profile-card">
      <div class="profile-photo">
  <img id="profilePhoto" src="" alt="Dog photo">
</div>

<input type="file" id="photoUpload" accept="image/*" class="upload-input">

      <div class="profile-photo"></div>
      <div class="profile-info">
        <h2 id="dogName">Dog Name</h2>
        <form id="editForm">
          <label>Breed</label>
          <input type="text" id="breedInput" />

          <label>Age</label>
          <input type="number" id="ageInput" />

          <label>Notes</label>
          <textarea id="notesInput"></textarea>

          <button type="submit" class="save-btn">Save Changes</button>
        </form>
      </div>
    </section>
  </main>

  <script src="profile.js"></script>

  <style>
/* PROFILE PAGE */
.profile-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin: 2rem 6vw;
  color: #35e5ff;
  text-shadow: 0 0 10px #35e5ff;
}

.back-link {
  color: #ff5fd1;
  text-decoration: none;
  font-weight: 600;
}

.profile-card {
  display: flex;
  gap: 2rem;
  background: radial-gradient(circle at top left, #1b1b2f 0%, #0b0b12 45%, #050509 100%);
  border-radius: 18px;
  border: 1px solid rgba(120, 255, 255, 0.35);
  box-shadow: 0 0 18px rgba(0, 255, 255, 0.35);
  padding: 2rem;
  margin: 2rem 6vw;
}

.profile-photo {
  width: 180px;
  height: 180px;
  background: rgba(255, 255, 255, 0.05);
  border-radius: 12px;
  border: 1px solid rgba(255, 95, 209, 0.4);
}

.save-btn {
  margin-top: 1rem;
  background: linear-gradient(90deg, #35e5ff, #ff5fd1);
  border: none;
  padding: 0.6rem 1.2rem;
  border-radius: 8px;
  color: #0b0b12;
  font-weight: 700;
  cursor: pointer;
}
</style>

</body>
</html>
