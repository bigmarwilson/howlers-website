<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>User Profile | Howlers Backyard</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div class="grain"></div>
  <div class="ambient-shimmer"></div>

  <header>
    <div class="logo">HOWLERS BACKYARD</div>
    <nav>
      <a href="index.html">Home</a>
      <a href="join.html">Join</a>
      <a href="signin.html">Sign‑In</a>
      <a href="dashboard.html">Dashboard</a>
    </nav>
  </header>

  <main>
    <section class="add-dog-card">
      <!-- LEFT: Photo + intro -->
      <div>
        <div class="add-dog-header">
          <h1 class="add-dog-title">Add a dog</h1>
          <p class="add-dog-subtitle">
            Create a profile for your dog so you can manage visits, track health notes, and keep their routine consistent.
          </p>
        </div>

        <div class="profile-photo-wrap">
          <img id="profilePhoto" src="images/dogs/sample-dog.jpg" alt="Dog photo">
        </div>

        <input type="file" id="photoUpload" accept="image/*" class="upload-input">
      </div>

      <!-- RIGHT: Form fields -->
      <div>
        <form id="addDogForm" class="add-dog-form">
          <!-- Identity -->
          <div class="form-group">
            <label for="dogName">Dog name</label>
            <input type="text" id="dogName" required />
          </div>

          <div class="form-group">
            <label for="breed">Breed</label>
            <input type="text" id="breed" required />
          </div>

          <div class="form-group">
            <label for="age">Age (years)</label>
            <input type="number" id="age" min="0" required />
          </div>

          <div class="form-group">
            <label for="sex">Sex</label>
            <select id="sex" required>
              <option value="">Select</option>
              <option value="Female">Female</option>
              <option value="Male">Male</option>
              <option value="Unknown">Unknown</option>
            </select>
          </div>

          <div class="form-group">
            <label for="weight">Weight (lbs)</label>
            <input type="number" id="weight" min="0" />
          </div>

          <div class="form-group">
            <label for="birthday">Birthday</label>
            <input type="date" id="birthday" />
          </div>

          <!-- Health -->
          <div class="form-group form-full-width">
            <label for="healthConcerns">Health concerns</label>
            <textarea id="healthConcerns" placeholder="Allergies, injuries, chronic conditions..."></textarea>
          </div>

          <div class="form-group">
            <label for="vaccinationStatus">Vaccination status</label>
            <select id="vaccinationStatus">
              <option value="">Select</option>
              <option value="Up to date">Up to date</option>
              <option value="Needs update soon">Needs update soon</option>
              <option value="Unknown">Unknown</option>
            </select>
          </div>

          <!-- Behavior -->
          <div class="form-group">
            <label for="temperament">Temperament</label>
            <input type="text" id="temperament" placeholder="Energetic, shy, confident..." />
          </div>

          <div class="form-group form-full-width">
            <label for="tags">Tags</label>
            <input
              type="text"
              id="tags"
              placeholder="Zoomies Champion, Treat Connoisseur, Loves Tug Toys"
            />
          </div>

          <div class="form-group form-full-width">
            <label for="notes">Notes</label>
            <textarea id="notes" placeholder="Anything staff should know about your dog."></textarea>
          </div>

          <!-- Membership -->
          <div class="form-group">
            <label for="membershipTier">Membership tier</label>
            <select id="membershipTier">
              <option value="">Select</option>
              <option value="Unlimited Howler">Unlimited Howler</option>
              <option value="Weekend Warrior">Weekend Warrior</option>
              <option value="Day Pass Regular">Day Pass Regular</option>
              <option value="Puppy Pack">Puppy Pack</option>
            </select>
          </div>

          <!-- Actions -->
          <div class="form-full-width actions-row">
            <button type="submit" class="btn-primary">Save dog</button>
            <button type="button" class="btn-secondary" onclick="window.location.href='dashboard.html'">
              Cancel
            </button>
          </div>
        </form>
      </div>
    </section>
  </main>

  <footer>
    <p>© 2026 Howlers Backyard</p>
    <a href="dashboard.html">Back to Dashboard</a>
  </footer>

  <script>
    // STEP 1 — Load or initialize dog database
let dogs = JSON.parse(localStorage.getItem("dogs")) || {};

// Photo preview only (no saving yet)
const photoInput = document.getElementById("photoUpload");
const photoImg = document.getElementById("profilePhoto");

photoInput.addEventListener("change", function (event) {
  const file = event.target.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = function (e) {
    photoImg.src = e.target.result;
  };
  reader.readAsDataURL(file);
});

// For now, prevent actual submit and just show an alert
document.getElementById("addDogForm").addEventListener("submit", function (e) {
  e.preventDefault();
  alert("Dog saved (demo). Next step: connect this to the dashboard.");
});

     // STEP 2 — Save dog into localStorage
document.getElementById("addDogForm").addEventListener("submit", function (e) {
  e.preventDefault();

  // Read form fields
  const name = document.getElementById("dogName").value.trim();
  const breed = document.getElementById("breed").value.trim();
  const age = document.getElementById("age").value.trim();
  const sex = document.getElementById("sex").value;
  const weight = document.getElementById("weight").value.trim();
  const birthday = document.getElementById("birthday").value;
  const healthConcerns = document.getElementById("healthConcerns").value.trim();
  const vaccinationStatus = document.getElementById("vaccinationStatus").value;
  const temperament = document.getElementById("temperament").value.trim();
  const tags = document.getElementById("tags").value.trim();
  const notes = document.getElementById("notes").value.trim();
  const membershipTier = document.getElementById("membershipTier").value;

  // Ensure name is provided
  if (!name) {
    alert("Please enter a dog name.");
    return;
  }

  // Prevent duplicate names
  if (dogs[name]) {
    alert("A dog with this name already exists. Please choose a different name.");
    return;
  }

  // Prevent more than 6 dogs
  if (Object.keys(dogs).length >= 6) {
    alert("You have reached the maximum of 6 dogs.");
    return;
  }

  // Get photo (data URL)
  const photoDataURL = document.getElementById("profilePhoto").src;

  // Build dog object
  const dog = {
    name,
    breed,
    age,
    sex,
    weight,
    birthday,
    healthConcerns,
    vaccinationStatus,
    temperament,
    tags,
    notes,
    membershipTier,
    photo: photoDataURL
  };

  // Save dog into the dogs object
  dogs[name] = dog;

  // Save back to localStorage
  localStorage.setItem("dogs", JSON.stringify(dogs));

  // Success message
  alert(`${name} has been added!`);

  // Clear form for next dog
  document.getElementById("addDogForm").reset();

  // Reset photo preview
  document.getElementById("profilePhoto").src = "images/dogs/sample-dog.jpg";
});

  </script>
</body>
</html>
