<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Edit Dog | Howlers Backyard</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div class="grain"></div>
  <div class="ambient-shimmer"></div>

  <header>
    <div class="logo">HOWLERS BACKYARD</div>
    <nav>
      <a href="index.html">Home</a>
      <a href="join.html">Join</a>
      <a href="signin.html">Sign‑In</a>
      <a href="dashboard.html">Dashboard</a>
    </nav>
  </header>

  <main>
    <section class="add-dog-card">
      <!-- LEFT: Photo + intro -->
      <div>
        <div class="add-dog-header">
          <h1 class="add-dog-title">Edit Dog</h1>
          <p class="add-dog-subtitle">
            Update your dog's profile information.
          </p>
        </div>

        <div class="profile-photo-wrap">
          <img id="profilePhoto" src="images/dogs/sample-dog.jpg" alt="Dog photo">
        </div>

        <input type="file" id="photoUpload" accept="image/*" class="upload-input">
      </div>

      <!-- RIGHT: Form fields -->
      <div>
        <form id="editDogForm" class="add-dog-form">
          <!-- Identity (READ ONLY) -->
          <div class="form-group">
            <label for="dogName">Dog name</label>
            <input type="text" id="dogName" readonly />
          </div>

          <div class="form-group">
            <label for="breed">Breed</label>
            <input type="text" id="breed" readonly />
          </div>

          <div class="form-group">
            <label for="age">Age (years)</label>
            <input type="number" id="age" readonly />
          </div>

          <div class="form-group">
            <label for="sex">Sex</label>
            <select id="sex" disabled>
              <option value="Female">Female</option>
              <option value="Male">Male</option>
              <option value="Unknown">Unknown</option>
            </select>
          </div>

          <div class="form-group">
            <label for="birthday">Birthday</label>
            <input type="date" id="birthday" readonly />
          </div>

          <!-- Editable fields -->
          <div class="form-group">
            <label for="weight">Weight (lbs)</label>
            <input type="number" id="weight" min="0" />
          </div>

          <div class="form-group form-full-width">
            <label for="healthConcerns">Health concerns</label>
            <textarea id="healthConcerns"></textarea>
          </div>

          <div class="form-group">
            <label for="vaccinationStatus">Vaccination status</label>
            <select id="vaccinationStatus">
              <option value="Up to date">Up to date</option>
              <option value="Needs update soon">Needs update soon</option>
              <option value="Unknown">Unknown</option>
            </select>
          </div>

          <div class="form-group">
            <label for="temperament">Temperament</label>
            <input type="text" id="temperament" />
          </div>

          <div class="form-group form-full-width">
            <label for="tags">Tags</label>
            <input type="text" id="tags" />
          </div>

          <div class="form-group form-full-width">
            <label for="notes">Notes</label>
            <textarea id="notes"></textarea>
          </div>

          <div class="form-group">
            <label for="membershipTier">Membership tier</label>
            <select id="membershipTier">
              <option value="Unlimited Howler">Unlimited Howler</option>
              <option value="Weekend Warrior">Weekend Warrior</option>
              <option value="Day Pass Regular">Day Pass Regular</option>
              <option value="Puppy Pack">Puppy Pack</option>
            </select>
          </div>

          <!-- Actions -->
          <div class="form-full-width actions-row">
            <button type="submit" class="btn-primary">Save changes</button>
            <button type="button" class="btn-secondary" onclick="window.location.href='dashboard.html'">
              Cancel
            </button>
          </div>
        </form>
      </div>
    </section>
  </main>

  <footer>
    <p>© 2026 Howlers Backyard</p>
    <a href="dashboard.html">Back to Dashboard</a>
  </footer>

  <script>
    // Load dog name from URL
    const params = new URLSearchParams(window.location.search);
    const dogName = params.get("dog");

    // Load dogs database
    let dogs = JSON.parse(localStorage.getItem("dogs")) || {};
    let dog = dogs[dogName];

    // If dog doesn't exist, redirect
    if (!dog) {
      alert("Dog not found.");
      window.location.href = "dashboard.html";
    }

    // Fill form fields with existing data
    document.getElementById("dogName").value = dog.name;
    document.getElementById("breed").value = dog.breed;
    document.getElementById("age").value = dog.age;
    document.getElementById("sex").value = dog.sex;
    document.getElementById("birthday").value = dog.birthday;

    document.getElementById("weight").value = dog.weight;
    document.getElementById("healthConcerns").value = dog.healthConcerns;
    document.getElementById("vaccinationStatus").value = dog.vaccinationStatus;
    document.getElementById("temperament").value = dog.temperament;
    document.getElementById("tags").value = dog.tags;
    document.getElementById("notes").value = dog.notes;
    document.getElementById("membershipTier").value = dog.membershipTier;

    // Load photo
    document.getElementById("profilePhoto").src = dog.photo;

    // Photo preview
    const photoInput = document.getElementById("photoUpload");
    const photoImg = document.getElementById("profilePhoto");

    photoInput.addEventListener("change", function (event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function (e) {
        photoImg.src = e.target.result;
      };
      reader.readAsDataURL(file);
    });

    // Save updated dog info
    document.getElementById("editDogForm").addEventListener("submit", function (e) {
      e.preventDefault();

      // Update ONLY editable fields
      dog.weight = document.getElementById("weight").value.trim();
      dog.healthConcerns = document.getElementById("healthConcerns").value.trim();
      dog.vaccinationStatus = document.getElementById("vaccinationStatus").value;
      dog.temperament = document.getElementById("temperament").value.trim();
      dog.tags = document.getElementById("tags").value.trim();
      dog.notes = document.getElementById("notes").value.trim();
      dog.membershipTier = document.getElementById("membershipTier").value;

      // Update photo
      dog.photo = document.getElementById("profilePhoto").src;

      // Save back to localStorage
      dogs[dogName] = dog;
      localStorage.setItem("dogs", JSON.stringify(dogs));

      alert("Dog profile updated!");
    });
  </script>
</body>
</html>
