<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join Howlers Dog Park</title>

    <!-- Global Stylesheet -->
    <link rel="stylesheet" href="styles.css">

    <!-- Page-Specific Styling -->
    <style>
        .join-page {
            background-image: url('assets/images/membership-image.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }

        .join-wrapper {
            max-width: 700px;
            margin: 6rem auto;
            padding: 2rem 2.5rem;
            background: rgba(5,7,10,0.85);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 14px;
            box-shadow: 0 0 24px rgba(53,229,255,0.25);
        }

        .join-wrapper h1 {
            text-align: center;
            font-size: 2rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-bottom: 1.5rem;
            color: var(--accent-cyan);
        }

        .join-wrapper p {
            text-align: center;
            color: #c3c7d3;
            margin-bottom: 2rem;
            font-size: 1rem;
        }

        .join-form label {
            display: block;
            margin-top: 1rem;
            margin-bottom: 0.4rem;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: #d5d8e4;
        }

        .join-form input {
            width: 100%;
            padding: 0.7rem;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.15);
            background: rgba(255,255,255,0.05);
            color: var(--text-offwhite);
            font-size: 1rem;
        }

        .join-form input:focus {
            outline: none;
            border-color: var(--accent-cyan);
            box-shadow: 0 0 12px rgba(53,229,255,0.4);
        }

        .submit-btn {
            margin-top: 2rem;
            width: 100%;
            padding: 0.9rem;
            border: none;
            border-radius: 999px;
            background: linear-gradient(120deg, var(--accent-cyan), var(--accent-green));
            color: #020305;
            font-size: 1rem;
            font-weight: 700;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: 0 0 24px rgba(53,229,255,0.45);
        }

        .submit-btn:hover {
            background: linear-gradient(120deg, var(--accent-pink), var(--accent-orange));
        }
    </style>
</head>

<body class="join-page">

    <div class="grain"></div>

    <!-- Header (copied from your main site) -->
    <header>
        <div class="logo">HOWLERS DOG PARK</div>
        <nav>
            <a href="index.html">Home</a>
            <a href="join.html">Join</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <!-- Main Join Section -->
    <div class="join-wrapper">
        <h1>Become a Member</h1>
        <p>Sign up to enjoy full access to Howlers Dog Park, member events, and priority scheduling.</p>

        <form class="join-form">

            <label>Full Name</label>
            <input type="text" required>

            <label>Email Address</label>
            <input type="email" required>

            <label>Phone Number</label>
            <input type="text" required>

            <label>Dog’s Name</label>
            <input type="text" required>

            <label>Dog’s Breed</label>
            <input type="text" required>

            <label>Create Password</label>
            <input type="password" required>

            <button type="submit" class="submit-btn">Create Membership</button>

        </form>
    </div>

    <!-- Footer -->
    <footer>
        <div>© 2026 Howlers Dog Park</div>
        <div><a href="index.html">Back to Home</a></div>
    </footer>

</body>
</html>
