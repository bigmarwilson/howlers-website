<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join Howlers Dog Park</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body class="join-page">

    <div class="page-container">

        <h1 class="page-title">BECOME A HOWLERS MEMBER</h1>

        <div class="membership-form-box">

            <h2>Membership Registration</h2>

            <p>Sign up to enjoy full access to Howlers Dog Park, member events, and priority scheduling.</p>

            <form class="join-form">

                <label>Full Name</label>
                <input type="text" required>

                <label>Email Address</label>
                <input type="email" required>

                <label>Phone Number</label>
                <input type="text" required>

                <label>Dog’s Name</label>
                <input type="text" required>

                <label>Dog’s Breed</label>
                <input type="text" required>

                <label>Create Password</label>
                <input type="password" required>

                <button type="submit" class="submit-btn">Create Membership</button>

            </form>

        </div>

    </div>

</body>
</html>
